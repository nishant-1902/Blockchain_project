{% extends "base.html" %}

{% block title %}Login - ICIDS{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    
    .navbar, .sidebar, .footer, .main-wrapper {
        display: none;
    }
    
    .content {
        padding: 0;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    
    .login-container {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 40px;
        width: 100%;
        max-width: 400px;
        animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .login-header h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #2563eb;
        margin-bottom: 10px;
    }
    
    .login-header p {
        color: #6b7280;
        font-size: 0.95rem;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-control {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px 15px;
        font-size: 0.95rem;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    
    .form-control:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .form-label {
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
    }
    
    .btn-login {
        width: 100%;
        padding: 12px;
        font-weight: 600;
        border-radius: 8px;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        border: none;
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1rem;
    }
    
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }
    
    .btn-login:active {
        transform: translateY(0);
    }
    
    .btn-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    
    .error-alert {
        background-color: #fee2e2;
        color: #dc2626;
        padding: 12px 15px;
        border-radius: 8px;
        border-left: 4px solid #dc2626;
        margin-bottom: 20px;
        display: none;
    }
    
    .error-alert.show {
        display: block;
        animation: slideDown 0.3s ease;
    }
    
    .register-link {
        text-align: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
    }
    
    .register-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
    }
    
    .register-link a:hover {
        color: #1d4ed8;
    }
    
    .loading-spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 10px;
    }
    
    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
    
    .btn-login.loading {
        pointer-events: none;
        opacity: 0.8;
    }
    
    .btn-login.loading .loading-spinner {
        display: inline-block;
    }
    
    .password-toggle {
        cursor: pointer;
        color: #6b7280;
        user-select: none;
    }
    
    .form-control-wrapper {
        position: relative;
    }
    
    .password-toggle-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #6b7280;
        font-size: 1.1rem;
        padding: 5px;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-header">
        <h1><i class="bi bi-shield-lock"></i> ICIDS</h1>
        <p>Intrusion Detection & Defense System</p>
    </div>
    
    <div class="error-alert" id="errorAlert"></div>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" 
                   placeholder="Enter your username" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="form-control-wrapper">
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="Enter your password" required>
                <button type="button" class="password-toggle-btn" id="togglePassword">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>
        
        <button type="submit" class="btn-login">
            <span class="loading-spinner"></span>
            <span class="btn-text">Login</span>
        </button>
    </form>
    
    <div class="register-link">
        Don't have an account? <a href="/register">Register here</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const loginForm = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.querySelector('.btn-login');
    
    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            togglePasswordBtn.innerHTML = '<i class="bi bi-eye-slash"></i>';
        } else {
            passwordInput.type = 'password';
            togglePasswordBtn.innerHTML = '<i class="bi bi-eye"></i>';
        }
    });
    
    // Handle login form submission
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        
        if (!username || !password) {
            showError('Please fill in all fields');
            return;
        }
        
        // Set loading state
        loginBtn.classList.add('loading');
        loginBtn.disabled = true;
        
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // Store JWT token
                localStorage.setItem('token', data.token);
                // Redirect to dashboard
                window.location.href = '/dashboard';
            } else {
                showError(data.message || 'Login failed. Please try again.');
            }
        } catch (error) {
            console.error('Login error:', error);
            showError('Connection error. Please try again.');
        } finally {
            // Remove loading state
            loginBtn.classList.remove('loading');
            loginBtn.disabled = false;
        }
    });
    
    function showError(message) {
        errorAlert.textContent = message;
        errorAlert.classList.add('show');
        setTimeout(() => {
            errorAlert.classList.remove('show');
        }, 5000);
    }
    
    // Clear error when user starts typing
    document.getElementById('username').addEventListener('input', () => {
        errorAlert.classList.remove('show');
    });
    
    document.getElementById('password').addEventListener('input', () => {
        errorAlert.classList.remove('show');
    });
</script>
{% endblock %}
